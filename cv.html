<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>CV — Wadjoud PHILIPPE</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #111827;
      color: #f9fafb;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .box {
      width: min(440px, 92vw);
      background: #fff;
      color: #111827;
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.25rem; color: #4b5563; line-height: 1.45; font-size: .95rem; }
    .btns { display: flex; flex-direction: column; gap: .75rem; }
    a.btn {
      display: block;
      background: #3730a3;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: .85rem 1.25rem;
      border-radius: 10px;
    }
    a.btn.secondary { background: #4338ca; }
    a.back {
      display: inline-block;
      margin-top: 1rem;
      color: #6b7280;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>CV — Wadjoud PHILIPPE</h1>
    <p>Choisis la version adaptée à l’offre Takima.</p>
    <div class="btns">
      <a class="btn" href="assets/cv-de.pdf" download="CV-Wadjoud-PHILIPPE-DE.pdf">CV DE (Takima)</a>
      <a class="btn secondary" href="assets/cv-tima.pdf" download="CV-Wadjoud-PHILIPPE-TIMA.pdf">CV TIMA (Takima)</a>
    </div>
    <a class="back" href="index.html">← Retour au portfolio</a>
  </div>
</body>
</html>
