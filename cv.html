<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>CV — Wadjoud PHILIPPE — TIMA</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #111827;
      color: #f9fafb;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .box {
      width: min(420px, 92vw);
      background: #fff;
      color: #111827;
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.25rem; color: #4b5563; line-height: 1.45; font-size: .95rem; }
    a.btn {
      display: inline-block;
      background: #3730a3;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: .85rem 1.25rem;
      border-radius: 10px;
    }
    a.back {
      display: inline-block;
      margin-top: 1rem;
      color: #6b7280;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>CV TIMA — Takima</h1>
    <p>Télécharge le PDF directement (version stable, lisible, 1 page A4).</p>
    <a class="btn" href="assets/cv-tima.pdf" download="CV-Wadjoud-PHILIPPE-TIMA.pdf">Télécharger le PDF</a>
    <br>
    <a class="back" href="index.html">← Retour au portfolio</a>
  </div>
  <script>
    // Téléchargement auto si on arrive depuis le bouton CV
    if (location.search.includes('auto=1')) {
      const a = document.createElement('a');
      a.href = 'assets/cv-tima.pdf';
      a.download = 'CV-Wadjoud-PHILIPPE-TIMA.pdf';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
</body>
</html>
